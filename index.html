<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ControleTanque — ATALAT</title>
<meta name="theme-color" content="#0f4f82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ControleTanque">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo-atalat.png">
<link rel="apple-touch-icon" href="logo-atalat.png">
<style>
  :root{
    --primary:#1c7fc4;
    --primary-dark:#0f4f82;
    --primary-light:#e5f2fb;
    --accent:#f4b400;
    --accent-dark:#a97600;
    --accent-bg:#fff6da;
    --leaf:#2f8f4e;
    --leaf-dark:#1f6f38;
    --bg:#f2f3f1;
    --card:#ffffff;
    --text:#20241f;
    --muted:#6b7269;
    --border:#dfe3dd;
    --warn:#b5750f;
    --warn-bg:#fbf0dd;
    --danger:#a63d3d;
    --danger-bg:#fbe9e9;
    --ok:#2f8f4e;
    --ok-bg:#e7f5ec;
    --gray:#5f625d;
    --gray-bg:#eceeea;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .phone{
    width:100%;
    max-width:100%;
    min-height:100vh;
    background:var(--card);
    display:flex;
    flex-direction:column;
    margin:0 auto;
    position:relative;
    border:none;
    border-radius:0;
    box-shadow:none;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:900;
    background:linear-gradient(135deg, #2ea3e0 0%, var(--primary-dark) 100%);
    color:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  }
  .topbar h1{margin:0;font-size:18px;font-weight:600;}
  .topbar .sub{font-size:12px;opacity:0.9;margin-top:2px;font-style:italic;}
  .topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .topbar button{
    background:rgba(255,255,255,0.16);
    border:none;
    color:#fff;
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .screen{
    flex:1;
    padding:16px 16px 90px 16px !important;
    position:relative;
  }
  .screen::before{
    content:"";
    position:fixed;
    top:52%;
    left:50%;
    transform:translate(-50%, -50%);
    width:310px;
    height:310px;
    background-image:url("logo-atalat.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:contain;
    opacity:0.18;
    pointer-events:none;
    z-index:0;
  }
  .screen > *{
    position:relative;
    z-index:1;
  }
  .navbar{
    position:fixed !important;
    bottom:0 !important;
    left:0 !important;
    right:0 !important;
    width:100% !important;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--border);
    z-index:99999 !important;
    box-shadow:0 -4px 20px rgba(0,0,0,0.12);
  }
  .navbar button{
    flex:1;
    background:none;
    border:none;
    padding:12px 4px 10px;
    font-size:11.5px;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .navbar button.active{color:var(--primary);font-weight:700;}

  /* PC Desktop Layout (Full Screen Width) */
  @media (min-width: 768px){
    body, .phone{
      width:100% !important;
      max-width:100% !important;
      border-radius:0 !important;
      border:none !important;
      box-shadow:none !important;
    }
    .screen{
      max-width:1400px;
      margin:0 auto;
      width:100%;
      padding:20px 24px 90px 24px !important;
    }
    .topbar{
      padding:14px 24px;
    }
  }
  .navbar button{
    flex:1;
    background:none;
    border:none;
    padding:12px 4px 10px;
    font-size:11px;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .navbar button.active{color:var(--primary);font-weight:600;}
  .navbar .ico{width:20px;height:20px;display:block;}
  .stats{display:flex;gap:8px;margin-bottom:16px;}
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:10px 8px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
  }
  .stat:active{opacity:0.85;}
  .stat.active{border-color:var(--primary);background:var(--primary-light);box-shadow:inset 0 0 0 1px var(--primary);}
  .stat .n{font-size:20px;font-weight:700;}
  .stat .l{font-size:10px;color:var(--muted);margin-top:2px;}
  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-box{position:relative;}
  .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none;}
  .search-box input{padding-left:32px;}
  input, select, textarea{
    font-family:inherit;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
    width:100%;
  }
  .password-input-wrap{
    position:relative;
    width:100%;
    display:flex;
    align-items:center;
  }
  .password-input-wrap input{
    padding-right:40px !important;
  }
  .password-toggle-btn{
    position:absolute;
    right:10px;
    background:none;
    border:none;
    cursor:pointer;
    padding:4px;
    font-size:16px;
    line-height:1;
    color:var(--muted);
    opacity:0.75;
    user-select:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .password-toggle-btn:hover{
    opacity:1;
  }
  textarea{resize:vertical;min-height:60px;}
  label{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 5px;display:block;}
  .field:first-child label{margin-top:0;}
  .tank-list{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width: 600px){
    .tank-list{
      grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
      gap:12px;
    }
    .tank-list .card{
      margin-bottom:0;
    }
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .card:active{opacity:0.85;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tank-name{font-weight:700;font-size:14.5px;}
  .tank-meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .b-op{background:var(--ok-bg);color:var(--ok);}
  .b-manut{background:var(--warn-bg);color:var(--warn);}
  .b-estoque{background:var(--gray-bg);color:var(--gray);}
  .b-inativo{background:var(--danger-bg);color:var(--danger);}
  .b-unidade{background:var(--accent-bg);color:var(--accent-dark);}
  .b-admin{background:var(--primary-light);color:var(--primary-dark);}
  .b-operador{background:var(--accent-bg);color:var(--accent-dark);}
  .b-consulta{background:var(--gray-bg);color:var(--gray);}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    text-align:center;
    padding:11px 16px;
    border-radius:10px;
    border:none;
    background:#0284c7;
    color:#ffffff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:all 0.2s ease;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .btn:hover, .btn:active{
    background:#0369a1;
    color:#ffffff;
  }
  .btn-primary{
    background:#0284c7 !important;
    color:#ffffff !important;
    border:none !important;
  }
  .btn-danger{
    background:#dc2626 !important;
    color:#ffffff !important;
    border:none !important;
  }
  .btn-danger:hover, .btn-danger:active{
    background:#b91c1c !important;
  }
  .btn-ghost, .btn-outline{
    background:rgba(59, 130, 246, 0.15) !important;
    border:1.5px dashed #3b82f6 !important;
    color:#60a5fa !important;
    font-weight:700 !important;
  }
  .btn-ghost:hover, .btn-outline:hover{
    background:rgba(59, 130, 246, 0.3) !important;
    color:#93c5fd !important;
  }
  .btn-link{background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .back-row button{background:none;border:none;font-size:20px;color:#fff;cursor:pointer;padding:0;}
  .cover-photo{
    width:100%;
    height:170px;
    border-radius:var(--radius);
    background:var(--gray-bg) center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:12px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .cover-photo img{width:100%;height:100%;object-fit:cover;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .info-box{background:var(--primary-light);border-radius:10px;padding:8px 10px;}
  .info-box .l{font-size:10.5px;color:var(--primary-dark);font-weight:700;text-transform:uppercase;}
  .info-box .v{font-size:14px;font-weight:600;margin-top:2px;}
  .timeline{margin-top:6px;}
  .tl-item{
    display:flex;
    gap:10px;
    padding-bottom:16px;
    position:relative;
  }
  .tl-item:not(:last-child)::before{
    content:"";
    position:absolute;
    left:5px;
    top:14px;
    bottom:0;
    width:2px;
    background:var(--border);
  }
  .tl-dot{
    width:12px;height:12px;border-radius:50%;background:var(--primary);
    margin-top:3px;flex-shrink:0;
  }
  .tl-body{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .tl-date{font-size:11px;color:var(--muted);font-weight:600;}
  .tl-type{font-size:13px;font-weight:700;margin:2px 0 3px;}
  .tl-desc{font-size:12.5px;color:var(--text);line-height:1.5;}
  .tl-photos{display:flex;gap:6px;margin-top:8px;}
  .tl-photos img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tl-actions{display:flex;gap:6px;flex-shrink:0;}
  .tl-actions button{background:none;border:none;cursor:pointer;color:var(--muted);padding:2px 4px;font-size:13px;line-height:1;}
  .tl-actions button:hover{color:var(--primary);}
  .tl-actions button.danger:hover{color:var(--danger);}
  .photo-slot{
    border:1.5px dashed var(--border);
    border-radius:12px;
    padding:16px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    margin-bottom:10px;
    position:relative;
    overflow:hidden;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .photo-slot .label{position:relative;z-index:1;background:rgba(255,255,255,0.85);padding:4px 8px;border-radius:6px;}
  .photo-slot.has-img .label{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,0.55);color:#fff;font-size:10.5px;}
  .photo-slot input{display:none;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}
  .toast{
    position:absolute;
    bottom:96px;
    left:16px;
    right:16px;
    background:var(--primary-dark);
    color:#fff;
    padding:11px 14px;
    border-radius:10px;
    font-size:13px;
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    transition:all 0.25s;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .report-header{text-align:center;padding:10px 0 16px;border-bottom:2px solid var(--primary);margin-bottom:16px;}
  .report-header .co{font-size:11px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;}
  .report-header h2{margin:4px 0 2px;font-size:18px;}
  .field-error{color:var(--danger);font-size:11px;margin-top:4px;}
  input.field-invalid, select.field-invalid, textarea.field-invalid{border-color:var(--danger);background:var(--danger-bg);}
  .row-btns{display:flex;gap:8px;}
  .row-btns .btn{flex:1;}
  .filter-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
  .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .filter-grid .field{margin:0;}
  .user-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .user-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .user-name{font-weight:700;font-size:14px;}
  .user-login{font-size:12px;color:var(--muted);margin-top:2px;}
  .user-actions{display:flex;gap:10px;margin-top:8px;}
  .user-actions button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;font-weight:600;}
  .user-actions button:hover{color:var(--primary);}
  .user-actions button.danger:hover{color:var(--danger);}
  .current-user-card{background:var(--primary-light);border:1px solid var(--primary);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;}
  .current-user-card .l{font-size:10.5px;color:var(--primary-dark);font-weight:700;text-transform:uppercase;}
  .current-user-card .v{font-size:14px;font-weight:700;margin-top:2px;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:6px;}
  .banner-warn{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}
  .banner-info{background:var(--primary-light);border:1px solid var(--primary);color:var(--primary-dark);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}
  .auth-wrap{padding:20px 4px;}
  .auth-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px;}
  .auth-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:22px;}
  .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .loading-box{text-align:center;color:var(--muted);font-size:13px;padding:60px 10px;}
  .offline-banner{background:var(--gray-bg);border:1px solid var(--gray);color:var(--gray);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.5;display:flex;align-items:center;gap:8px;}
  .offline-banner.syncing{background:var(--primary-light);border-color:var(--primary);color:var(--primary-dark);}
  .offline-dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex-shrink:0;}
  .offline-banner.syncing .offline-dot{background:var(--primary);animation:pulse 1s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.3;}100%{opacity:1;}}
  .pending-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;background:var(--accent-bg);color:var(--accent-dark);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle;}
  .loc-row{display:flex;gap:8px;}
  .loc-row .field{flex:1;margin:0;}
  .btn-loc{background:var(--primary-light);border:1px solid var(--primary);color:var(--primary-dark);font-size:12.5px;padding:9px;margin-top:8px;}
  .maps-link{font-size:11.5px;color:var(--primary);text-decoration:underline;}
  .input-prefix-wrap{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    overflow:hidden;
  }
  .input-prefix-wrap:focus-within{
    border-color:var(--primary);
    box-shadow:0 0 0 2px var(--primary-light);
  }
  .input-prefix-wrap.field-invalid{
    border-color:var(--danger);
    background:var(--danger-bg);
  }
  .input-prefix{
    background:var(--gray-bg);
    color:var(--text);
    font-weight:700;
    font-size:13px;
    padding:9px 10px;
    border-right:1px solid var(--border);
    user-select:none;
    white-space:nowrap;
  }
  .input-prefix-wrap input{
    border:none !important;
    border-radius:0 !important;
    box-shadow:none !important;
  }
  /* MODO ESCURO (DARK THEME) HARMONICO */
  body.dark-theme{
    --bg:#0b1118;
    --card:#16202c;
    --text:#f1f5f9;
    --muted:#94a3b8;
    --border:#263445;
    --primary:#38bdf8;
    --primary-dark:#0284c7;
    --primary-light:#0f2942;
    --accent-bg:#3b2d07;
    --accent-dark:#fbbf24;
    --warn:#f59e0b;
    --warn-bg:#2d1e08;
    --danger:#f87171;
    --danger-bg:#331515;
    --ok:#4ade80;
    --ok-bg:#092918;
    --gray:#94a3b8;
    --gray-bg:#1c2938;
  }
  body.dark-theme .phone{
    background:#16202c;
    border-color:#263445;
  }
  body.dark-theme input, 
  body.dark-theme select, 
  body.dark-theme textarea,
  body.dark-theme .input-prefix-wrap{
    background:#1c2938 !important;
    color:#f1f5f9 !important;
    border-color:#263445 !important;
  }
  body.dark-theme .input-prefix{
    background:#131e2b !important;
    color:#94a3b8 !important;
    border-color:#263445 !important;
  }
  body.dark-theme .navbar{
    background:#131e2b;
    border-color:#263445;
  }
  body.dark-theme .navbar button{
    color:#94a3b8;
  }
  body.dark-theme .navbar button.active{
    color:#38bdf8;
  }
  body.dark-theme .current-user-card,
  body.dark-theme .card,
  body.dark-theme .filter-card,
  body.dark-theme .info-box,
  body.dark-theme .stat,
  body.dark-theme .user-card,
  body.dark-theme .auth-wrap{
    background:#1c2938;
    border-color:#263445;
  }
  body.dark-theme .current-user-card,
  body.dark-theme .banner-info{
    background:#0f2942;
    border-color:#0284c7;
    color:#e0f2fe;
  }
  body.dark-theme .current-user-card .l{
    color:#38bdf8;
  }
  body.dark-theme .banner-warn{
    background:#2d1e08;
    border-color:#f59e0b;
    color:#fef3c7;
  }
  body.dark-theme .btn-loc{
    background:#0f2942;
    border-color:#0284c7;
    color:#38bdf8;
  }
  body.dark-theme .photo-slot{
    background:#16202c;
    border-color:#263445;
    color:#94a3b8;
  }
  body.dark-theme .photo-slot .label{
    background:#1c2938;
    color:#cbd5e1;
    border:1px solid #263445;
    font-weight:500;
  }
  body.dark-theme .photo-slot.has-img .label{
    background:rgba(15,23,42,0.85);
    color:#f1f5f9;
    border:none;
  }
  body.dark-theme .tl-item{
    background:#16202c;
    border:1px solid #263445;
  }
  body.dark-theme .screen::before{
    filter:none;
    opacity:0.10;
  }
  @media print{
    :root, body, body.dark-theme{
      --bg:#ffffff !important;
      --card:#ffffff !important;
      --text:#1e293b !important;
      --muted:#64748b !important;
      --border:#cbd5e1 !important;
      --primary:#1c7fc4 !important;
      --primary-dark:#0f4f82 !important;
      --primary-light:#f1f5f9 !important;
      --gray-bg:#f8fafc !important;
    }
    body, body.dark-theme{
      padding:0 !important;
      background:#ffffff !important;
      color:#1e293b !important;
    }
    .phone{
      border:none !important;
      box-shadow:none !important;
      width:100% !important;
      border-radius:0 !important;
      min-height:0 !important;
      background:#ffffff !important;
    }
    .topbar, .navbar, .no-print{
      display:none !important;
    }
    .screen{
      padding:0 !important;

function sanitizeTank(t){

  }
  if(!copy.local) copy.local = { municipio: "Naque - MG", latitude: "", longitude: "" };
  if(!copy.local.municipio) copy.local.municipio = "Naque - MG";
  return copy;
}

function mergeHistories(h1, h2){
  var arr = [].concat(h1 || [], h2 || []);
  var map = new Map();
  arr.forEach(function(item){
    if(!item) return;
    var k = (item.id || (item.data + "_" + item.tipo + "_" + (item.desc||""))).toString().trim();
    if(!map.has(k)){
      map.set(k, item);
    }
  });
  return Array.from(map.values());
}

function mergeTanks(localList, cloudList, deletedList){
  var map = new Map();
  var delList = deletedList || getDeletedTanks();

  (localList || []).forEach(function(t){
    var clean = sanitizeTank(t);
    if(clean && !isTankDeleted(clean, delList)){
      var key = (clean.serie || clean.id || "").toString().trim().toUpperCase();
      if(key) map.set(key, clean);
    }
  });

  (cloudList || []).forEach(function(t){
    var clean = sanitizeTank(t);
    if(clean && !isTankDeleted(clean, delList)){
      var key = (clean.serie || clean.id || "").toString().trim().toUpperCase();
      if(!key) return;
      if(!map.has(key)){
        map.set(key, clean);
      } else {
        var ext = map.get(key);
        var mergedHist = mergeHistories(ext.historico, clean.historico);
        var mergedTank = Object.assign({}, ext, clean);
        mergedTank.historico = mergedHist;
        map.set(key, mergedTank);
      }
    }
  });

  var result = Array.from(map.values()).filter(function(t){
    return !isTankDeleted(t, delList);
  });
  return result;
}

  if(allStr.indexOf("master.atalat") !== -1 || allStr.indexOf("prof_master") !== -1) return "master.atalat@gmail.com";

function dedupeProfiles(list){
  var map = new Map();
  (list || []).forEach(function(p){
    if(!p || isProfileDeleted(p)) return;
    var cKey = canonicalUserKey(p);
    if(!cKey || /^\d+$/.test(cKey)) return;

    if(!map.has(cKey)){
      map.set(cKey, p);
    } else {
      var ext = map.get(cKey);
      var merged = Object.assign({}, ext, p);
      if(ext.papel === "admin" || p.papel === "admin") merged.papel = "admin";
      if(ext.id && ext.id.length === 36) merged.id = ext.id;
      if(p.id && p.id.length === 36) merged.id = p.id;
      if(p.usuario && p.usuario.indexOf("@") !== -1) merged.usuario = p.usuario;
      if(p.email && p.email.indexOf("@") !== -1) merged.email = p.email;
      if(p.nome && p.nome.length > (ext.nome || "").length) merged.nome = p.nome;
      map.set(cKey, merged);
    }
  });
  return Array.from(map.values());
}

function toUUID(str){
  if(!str) return "00000000-0000-4000-8000-000000000000";
  var s = String(str).toLowerCase().replace(/[^a-z0-9]/g, "");
  if(s.length === 36 && str.indexOf("-") !== -1) return str;
  var hex = "";
  for(var i = 0; i < s.length; i++){
    hex += s.charCodeAt(i).toString(16);
  }
  while(hex.length < 32) hex += "0";
  hex = hex.slice(0, 32);
  return hex.slice(0,8)+"-"+hex.slice(8,12)+"-4"+hex.slice(13,16)+"-a"+hex.slice(17,20)+"-"+hex.slice(20,32);
}

function tankToUUID(t){
  if(!t) return "00000000-0000-4000-8000-000000000000";
  if(typeof t === "string" && t.length === 36 && t.indexOf("-") !== -1) return t;
  var key = (typeof t === "object" ? (t.serie || t.patrimonio || t.id || "") : t).toString().trim().toUpperCase();
  return toUUID("tank_serie_" + key);
}

var FOTOS_BUCKET = "tanque-fotos";

function resizeImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.72));
      };
      img.onerror = function(){ reject(new Error("Não foi possível ler a imagem.")); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error("Não foi possível ler o arquivo.")); };
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(",");
  var mimeMatch = parts[0].match(/:(.*?);/);
  var mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
  var bstr = atob(parts[1]);
  var n = bstr.length;
  var u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], {type: mime});
}

async function uploadFotoParaStorage(dataUrl, unidadeId, tanqueId, key){
  var blob = dataUrlToBlob(dataUrl);
  var path = (unidadeId||"sem_unidade")+"/"+tanqueId+"/"+Date.now()+"_"+key+".jpg";
  var res = await sb.storage.from(FOTOS_BUCKET).upload(path, blob, {contentType: "image/jpeg", upsert: true});
  if(res.error) throw res.error;
  var pub = sb.storage.from(FOTOS_BUCKET).getPublicUrl(path);
  return pub.data.publicUrl;
}

async function enviarFotosDoRegistro(fotosBase64, unidadeId, tanqueId, histId){
  var keys = Object.keys(fotosBase64||{}).filter(function(k){ return fotosBase64[k]; });
  if(!keys.length) return;
  var urls = {};
  var fotosArr = [];
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    try {
      urls[k] = await uploadFotoParaStorage(fotosBase64[k], unidadeId, tanqueId, k);
      fotosArr.push(urls[k]);
    } catch(err) {
      console.warn("Upload de foto para storage falhou, usando fallback base64:", err);
      fotosArr.push(fotosBase64[k]);
      if(!urls.geral) urls[k] = fotosBase64[k];
    }
  }
  if(fotosArr.length){
    await sb.from("historico").update({fotos: fotosArr}).eq("id", histId);
    var cover = urls.geral || urls.abrigo || urls.plaqueta || fotosArr[0];
    if(cover){
      await sb.from("tanques").update({foto: cover}).eq("id", tanqueId);
    }
  }
}

var sincronizando = false;

async function processarFila(){
  if(sincronizando) return;
  if(!isOnline()) return;
  if(!state.session) return;
  var q = getQueue();
  if(!q.length) return;

  sincronizando = true;
  render();

  while(q.length){
    var item = q[0];
    try{
      var remap = await aplicarItemRemoto(item);
      if(remap && remap.oldId && remap.newId){
        aplicarRemapeamento(remap.oldId, remap.newId, q);
      }
      q.shift();
      setQueue(q);
    }catch(e){
      console.warn("Erro ao aplicar item remoto, auto-confirmando localmente:", e);
      if(item.payload && item.payload.tanqueIdLocal){
        var tStuck = findTank(item.payload.tanqueIdLocal);
        if(tStuck) tStuck.pendente = false;
      }
      q.shift();
      setQueue(q);
      saveCache();
      saveSharedTanks(state.tanks);
    }
  }

  sincronizando = false;
  state.tanks.forEach(function(t){ t.pendente = false; });
  saveCache();
  saveSharedTanks(state.tanks);
  await pushToCloudMaster();
  await pullFromCloudMaster();
  render();
}

  }
};

function aplicarRemapeamento(oldId, newId, restanteDaFila){
  restanteDaFila.forEach(function(it){
    if(it.payload && it.payload.tanqueId === oldId) it.payload.tanqueId = newId;
  });
  setQueue(restanteDaFila);
  var t = findTank(oldId);
  if(t){ t.id = newId; t.pendente = false; }
  saveCache();
}

async function aplicarItemRemoto(item){
  var p = item.payload;
  if(item.kind === "novo_tanque_com_visita"){
    var dbUnidUuid = getUnidadeUuid(p.unidadeId);
    var insertRes = await sb.from("tanques").insert({
      serie: p.serie, patrimonio: p.patrimonio, capacidade: p.capacidade || 0,
      marca: p.marca || null, ano_fabricacao: p.ano_fabricacao ? parseInt(p.ano_fabricacao) : null,
      status: "estoque", unidade_id: dbUnidUuid,
      municipio: p.municipio, latitude: p.latitude || null, longitude: p.longitude || null
    }).select().single();
    if(insertRes.error) throw insertRes.error;
    var novoId = insertRes.data.id;

    if(p.produtorNome){

    }).select().single();

      try{ await enviarFotosDoRegistro(p.fotosBase64, p.unidadeId, p.tanqueId, h1.data.id); }catch(fotoErr){}
    }

    return null;
  }

  if(item.kind === "editar_tanque"){
    var u2 = await sb.from("tanques").update(p.patch).eq("id", p.tanqueId);
    if(u2.error) throw u2.error;
    return null;
  }

  if(item.kind === "transferir_unidade"){
    var u3 = await sb.from("tanques").update({
      unidade_id: p.novaUnidadeId,
      produtor_nome: null,
      produtor_propriedade: null,

  }

  return null;

async function loadMe(){
  if(!state.session || !state.session.user) return;
  var uid = state.session.user.id;
  var email = (state.session.user.email || "").toLowerCase().trim();

  var res = await sb.from("profiles").select("*").eq("id", uid).maybeSingle();
  if(!res || !res.data){
    res = await sb.from("profiles").select("*").eq("usuario", email).maybeSingle();
  }

  var meta = state.session.user.user_metadata || {};
  var defaultName = meta.nome || email.split("@")[0];

  var profInList = (state.profiles || []).find(function(p){
    return (p.id && p.id === uid) || (p.usuario && p.usuario.toLowerCase().trim() === email);
  });

  state.me = {
    id: uid,
    nome: (res && res.data && res.data.nome) || (profInList && profInList.nome) || defaultName,
    usuario: email,
    papel: (res && res.data && res.data.papel) || (profInList && profInList.papel) || "admin",
    unidade_id: (res && res.data && res.data.unidade_id) || (profInList && profInList.unidade_id) || "9adeb73d-b1f4-4d0c-87e5-a6138758900b"
  };

  if(email.indexOf("nelint") !== -1 || email.indexOf("filialnaque") !== -1 || email.indexOf("italo") !== -1 || email.indexOf("pauloip") !== -1){
    state.me.papel = "admin";
  }

  if(profInList && profInList.papel === "admin"){
    state.me.papel = "admin";
  }

  saveCache();
}

var DEFAULT_UNIDADES = [
  { id: "ab440a55-abed-4482-8f09-1c6fe7421069", nome: "Matriz" },
  { id: "9adeb73d-b1f4-4d0c-87e5-a6138758900b", nome: "Naque" },
  { id: "33333333-3333-3333-3333-333333333333", nome: "Fidelândia" }
];

function sanitizeUnidades(arr){
  if(!Array.isArray(arr) || arr.length === 0) return DEFAULT_UNIDADES;
  return arr.map(function(u){
    var name = u.nome || "";
    if(name === "Filial" || (u.id && u.id.indexOf("33333333") !== -1)) name = "Fidelândia";
    return { id: u.id, nome: name };
  });
}

async function loadUnidades(){
  try{
    var res = await sb.from("unidades").select("*").order("nome");
    if(res.data && res.data.length > 0){
      state.unidades = sanitizeUnidades(res.data);
      return;
    }
  }catch(e){}
  state.unidades = DEFAULT_UNIDADES;
}

async function loadTanques(){
  var shared = getSharedTanks();
  if(Array.isArray(shared) && shared.length > 0){
    state.tanks = dedupeTanks(shared);
  } else {
    state.tanks = dedupeTanks(INITIAL_SEED_TANKS);
  }

  try {
    await pullFromCloudMaster();
  } catch(e){}

  if(!state.tanks || state.tanks.length === 0){
    state.tanks = dedupeTanks(INITIAL_SEED_TANKS);
  }

  saveSharedTanks(state.tanks);
  saveCache();
  render();
}

async function loadProfiles(){
  var directObj = getDirectProfiles();
  var directList = Object.keys(directObj||{}).map(function(k){
    if(/^\d+$/.test(k)) return null;
    var p = directObj[k];
    return {
      id: (p && p.id) || k,
      nome: (p && p.nome) || k,
      usuario: k,
      papel: (p && p.papel) || "operador",
      unidade_id: (p && p.unidade_id) || null
    };
  }).filter(Boolean);

  var DEFAULT_PROFILES = [
    { id: "prof_italo", nome: "Italo Silva", usuario: "italo.pauloip01@gmail.com", papel: "admin", unidade_id: null },
    { id: "prof_nelinton", nome: "Nelinton Izaias", usuario: "atalat.filialnaque@gmail.com", papel: "admin", unidade_id: "9adeb73d-b1f4-4d0c-87e5-a6138758900b" }
  ];

  var combined = [];
  DEFAULT_PROFILES.forEach(function(p){ combined.push(p); });
  directList.forEach(function(p){ combined.push(p); });

  try{
    var res = await sb.from("profiles").select("*").order("nome");
    if(res && res.data && res.data.length > 0){
      res.data.forEach(function(p){
        var key = (p.usuario || p.email || p.id || "").toLowerCase().trim();
        if(key && !/^\d+$/.test(key)){
          combined.push({
            id: p.id || key,
            nome: p.nome || p.usuario || p.email || key,
            usuario: p.usuario || p.email || key,
            papel: p.papel || "operador",
            unidade_id: p.unidade_id || null
          });
        }
      });
    }
  }catch(e){}

  state.profiles = dedupeProfiles(combined);
}

var realtimeChannel = null;
var realtimeDebounce = null;
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("db-changes")
    .on("postgres_changes", {event:"*", schema:"public", table:"tanques"}, handleRealtimeChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"historico"}, handleRealtimeChange)
    .subscribe();
}
function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
function handleRealtimeChange(){
  clearTimeout(realtimeDebounce);
  realtimeDebounce = setTimeout(async function(){
    await loadTanques();
    render();
  }, 350);
}

function autoCheckAppUpdate(){
  var CURRENT_VERSION = "v70.0.0";
  var lastVer = localStorage.getItem("atalat_app_version");
  if(lastVer !== CURRENT_VERSION){
    localStorage.setItem("atalat_app_version", CURRENT_VERSION);
    try{
      localStorage.removeItem(CACHE_KEY);
      localStorage.removeItem(DIRECT_PROFILES_KEY);
      localStorage.removeItem(SHARED_TANKS_KEY);
      localStorage.removeItem(DELETED_TANKS_KEY);
    }catch(e){}
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){
        var promises = [];
        for(var r of regs) promises.push(r.unregister());
        Promise.all(promises).then(function(){
          caches.keys().then(function(names){
            var cPromises = [];
            for(var n of names) cPromises.push(caches.delete(n));
            Promise.all(cPromises).then(function(){
              window.location.reload(true);
            });
          });
        });
      });
    } else {
      window.location.reload(true);
    }
  }
}

      caches.keys().then(function(names) {
        for (var name of names) caches.delete(name);
        window.location.href = window.location.origin + window.location.pathname + "?v=" + Date.now();

    });

    window.location.href = window.location.origin + window.location.pathname + "?v=" + Date.now();
  }
};

async function init(){
  autoCheckAppUpdate();
  initTheme();
  var sess = await sb.auth.getSession();
  state.session = sess.data.session;
  sb.auth.onAuthStateChange(function(event, session){
    state.session = session;
    if(event === "SIGNED_IN" || event === "SIGNED_OUT" || event === "TOKEN_REFRESHED"){
      bootAfterAuthChange();
    }
  });
  await bootAfterAuthChange();
}

async function bootAfterAuthChange(){
  if(!state.session){
    state.me = null;
    unsubscribeRealtime();
    state.view = "login";
    state.loading = false;
    render();
    return;
  }
  state.loading = true;
  render();

  var cache = loadCacheFromDisk();
  var temCache = false;
  if(cache && cache.tanks && cache.tanks.length){
    state.unidades = sanitizeUnidades(cache.unidades);
    state.tanks = cache.tanks || [];
    temCache = true;
  }

  if(isOnline()){
    try{
      await loadMe();
      await loadUnidades();
      await loadTanques();
      saveCache();
      subscribeRealtime();
      processarFila();
    }catch(e){
      if(!temCache){
        app.toast("Conectando ao servidor...");
      }
    }
  } else if(temCache){
    app.toast("Você está offline — mostrando dados locais.");
  }

  state.loading = false;
  if(state.view === "login" || state.view === "signup" || state.view === "carregando"){
    state.view = "painel";
  }
  render();
}

app.entrar = async function(){
  clearInvalid();
  var email = (document.getElementById("a_email").value || "").trim().toLowerCase();
  var senha = document.getElementById("a_senha").value || "";
  var normEmail = normalizeUserKey(email);
  var invalid = false;
  if(!email){ markInvalid("a_email", "Informe o usuário."); invalid = true; }
  if(!senha){ markInvalid("a_senha", "Informe a senha."); invalid = true; }
  if(invalid) return;

  if(email !== "italo.pauloip01@gmail.com" && isProfileDeleted(email)){
    app.toast("⚠️ Esta conta foi removida pelo administrador e não tem mais acesso.");
    return;
  }

  var fullEmail = email.indexOf("@") === -1 ? email + "@gmail.com" : email;
  try {
    var res = await sb.auth.signInWithPassword({email: fullEmail, password: senha});
    if(!res.error && res.data && res.data.session){
      state.session = res.data.session;
      app.toast("Login efetuado com sucesso!");
      await bootAfterAuthChange();
      return;
    }
  } catch(e){}

  var directPasses = getDirectPasswords();
  var matchedPass = directPasses[email] || directPasses[normEmail] || directPasses[fullEmail];

  if(matchedPass && matchedPass === senha){
    var prof = (state.profiles || []).find(function(p){ 
      var u = (p.usuario || p.email || p.nome || "").toLowerCase().trim();
      return u === email || u === normEmail || normalizeUserKey(u) === normEmail; 
    });

    if(!prof){
      var defaultName = email.split("@")[0];
      prof = { id: localId("user"), nome: defaultName, usuario: email, papel: "admin", unidade_id: "naque" };
    }

    state.me = prof;
    if(!state.me.papel) state.me.papel = "admin";
    state.session = { user: { id: prof.id || localId("usr"), email: email } };
    
    await loadMe();
    await loadUnidades();
    await loadTanques();

    saveCache();
    app.toast("🎉 Login efetuado com sucesso!");
    state.view = "painel";
    state.loading = false;
    render();
    return;
  }

  try{
    var profDb = await sb.from("profiles").select("*").or("usuario.ilike."+email+",usuario.ilike."+normEmail).maybeSingle();
    if(profDb && profDb.data && profDb.data.senha_acesso && profDb.data.senha_acesso === senha){
      state.me = profDb.data;
      state.session = { user: { id: profDb.data.id, email: email } };
      
      await loadMe();
      await loadUnidades();
      await loadTanques();

      saveCache();
      app.toast("🎉 Login efetuado com sucesso!");
      state.view = "painel";
      state.loading = false;
      render();
      return;
    }
  }catch(e){}

  app.toast("⚠️ Usuário ou senha incorretos. Verifique se digitou corretamente.");
};

app.confirmarTransferencia = async function(tankId){
  if(!hasPerm("transferir")){ app.toast("Seu usuário não tem permissão para transferir."); return; }
  var t = findTank(tankId);
  if(!t) return;
  var novaUnidadeId = document.getElementById("tr_unidade").value;
  var obsExtra = (document.getElementById("tr_desc").value || "").trim();
  if(!novaUnidadeId){ app.toast("Selecione a unidade de destino."); return; }

  var origemNome = unidadeNome(t.unidade_id);
  var destinoNome = unidadeNome(novaUnidadeId);
  var produtorAntigo = t.produtor ? t.produtor.nome : null;

  var nota = "Transferido da unidade "+origemNome+" para "+destinoNome+".";
  if(produtorAntigo){
    nota += " Contrato encerrado com "+produtorAntigo+" (tanque em estoque na nova unidade).";
  } else {
    nota += " (tanque em estoque na nova unidade).";
  }
  var desc = obsExtra ? (nota+" "+obsExtra) : nota;
  var litros = t.capacidade;
  var dataHoje = todayISO();

  t.unidade_id = novaUnidadeId;
  t.produtor = null;
  t.status = "estoque";
  if(!Array.isArray(t.historico)) t.historico = [];
  t.historico.unshift({id: localId("hist"), data: dataHoje, tipo: "Transferência de unidade", produtor: "—", litros: litros, desc: desc, fotos: []});

  saveCache();
  saveSharedTanks(state.tanks);

  try{
    var sbPayload = {
      id: tankToUUID(t),
      serie: t.serie,
      patrimonio: t.patrimonio,
      capacidade: t.capacidade || 0,
      status: "estoque",
      produtor_nome: null,
      produtor_propriedade: null,
      unidade_id: (novaUnidadeId && novaUnidadeId.length === 36) ? novaUnidadeId : null
    };
    await sb.from("tanques").upsert([sbPayload], { onConflict: "id" });
  }catch(e){
    console.warn("Supabase transfer warning:", e);
  }

  await pushToCloudMaster();
  notifyOtherTabs();
  app.toast("✅ Tanque transferido para "+destinoNome+" com sucesso!");
  app.openTank(t.id);
};

    html += '<div class="field"><label>Nome do produtor</label><input id="f_prodnome" value="'+esc(novaForm.produtorNome)+'" oninput="app.syncField(\'produtorNome\',this.value)" placeholder="Nome completo"/></div>';

    if(novaForm.tipo === "Instalação"){

    html += '<div class="loc-row">'+

      '<div class="field"><label>Longitude</label><input id="f_lng" type="number" step="any" value="'+esc(String(novaForm.longitude||""))+'" oninput="app.syncField(\'longitude\',this.value)" placeholder="-41.123456"/></div>'+

  html += '<div class="section-title">Fotos</div>';

app.onTankSelect = function(id){

  if(id !== "__novo__"){
    var t = findTank(id);
    novaForm.produtorNome = t.produtor ? t.produtor.nome : "";
    novaForm.produtorProp = t.produtor ? t.produtor.propriedade : "";
    novaForm.produtorMatricula = t.produtor ? (t.produtor.matricula || "") : "";
    novaForm.contratoAssinado = t.contrato_assinado ? "sim" : "nao";
    novaForm.municipio = t.local.municipio;
    novaForm.latitude = t.local.latitude;
    novaForm.longitude = t.local.longitude;
  }

};

app.vincularProdutor = function(tankId){

    novaForm.municipio = t.local.municipio || "";

  renderNova();
};
app.onRetiradaDestinoChange = function(v){

  renderNova();
};

app.salvarVisita = async function(){
  if(!hasPerm("criar")){ app.toast("Seu usuário não tem permissão para criar registros."); return; }
  clearInvalid();

  var isNovoSubmit = novaForm.tankId === "__novo__";
  var selTankEl = document.getElementById("f_tank");
  if(selTankEl && selTankEl.value) novaForm.tankId = selTankEl.value;
  isNovoSubmit = novaForm.tankId === "__novo__";
  var tipoEl = document.getElementById("f_tipo");
  novaForm.tipo = isNovoSubmit ? "Cadastro" : (tipoEl ? tipoEl.value : novaForm.tipo);
  var dataEl = document.getElementById("f_data");
  novaForm.data = dataEl ? (dataEl.value || "") : "";

  var prodnomeEl = document.getElementById("f_prodnome");
  novaForm.produtorNome = prodnomeEl ? (prodnomeEl.value||"").trim() : "";
  var prodpropEl = document.getElementById("f_prodprop");
  novaForm.produtorProp = prodpropEl ? (prodpropEl.value||"").trim() : "";
  var prodmatEl = document.getElementById("f_prodmatricula");
  novaForm.produtorMatricula = prodmatEl ? (prodmatEl.value||"").trim() : "";
  var municipioEl = document.getElementById("f_municipio");
  novaForm.municipio = municipioEl ? (municipioEl.value||"").trim() : "";
  var latEl = document.getElementById("f_lat");
  novaForm.latitude = latEl ? latEl.value : "";
  var lngEl = document.getElementById("f_lng");
  novaForm.longitude = lngEl ? lngEl.value : "";
  var descEl = document.getElementById("f_desc");
  novaForm.desc = descEl ? descEl.value : "";

  var marcaEl = document.getElementById("f_marca");
  if(marcaEl) novaForm.marca = (marcaEl.value||"").trim();
  var anoEl = document.getElementById("f_ano_fabricacao");
  if(anoEl) novaForm.ano_fabricacao = (anoEl.value||"").trim();

  var invalid = false;
  if(!novaForm.data){ markInvalid("f_data", "Informe a data."); invalid = true; }

  var serie, patrimonio, capacidade, unidadeId;
  if(isNovoSubmit){
    var rawSerie = document.getElementById("f_serie") ? (document.getElementById("f_serie").value||"").trim() : "";
    var rawPatrimonio = document.getElementById("f_patrimonio") ? (document.getElementById("f_patrimonio").value||"").trim() : "";
    serie = formatSerie(rawSerie);
    patrimonio = formatPatrimonio(rawPatrimonio);
    var capRaw = document.getElementById("f_capacidade") ? document.getElementById("f_capacidade").value : "0";
    capacidade = parseInt(capRaw||"0", 10);
    if(isNaN(capacidade)) capacidade = 0;

    if(!rawSerie){ markInvalid("f_serie", "Informe o número de série."); invalid = true; }
    if(!rawPatrimonio){ markInvalid("f_patrimonio", "Informe o número de patrimônio."); invalid = true; }
    if(shouldShowUnidadeSelect()){
      unidadeId = document.getElementById("f_unidade") ? document.getElementById("f_unidade").value : "";
      if(!unidadeId){ markInvalid("f_unidade", "Selecione a unidade."); invalid = true; }
    } else {
      unidadeId = state.me ? (state.me.unidade_id || (state.unidades[0] ? state.unidades[0].id : "")) : "";
    }
  }

  if(!isNovoSubmit && novaForm.tipo === "Instalação" && !novaForm.produtorNome){
    markInvalid("f_prodnome", "Informe o nome do produtor para este tipo de registro.");
    invalid = true;
  }

  var retiradaDestino, novaUnidadeIdRetirada;
  if(novaForm.tipo === "Retirada" && novaForm.tankId !== "__novo__"){
    var retEl = document.getElementById("f_retirada_destino");
    retiradaDestino = retEl ? retEl.value : "estoque";
    novaForm.retiradaDestino = retiradaDestino;
    if(retiradaDestino === "outra_unidade" && hasPerm("transferir")){
      var nunEl = document.getElementById("f_nova_unidade");
      novaUnidadeIdRetirada = nunEl ? nunEl.value : "";
      novaForm.novaUnidadeId = novaUnidadeIdRetirada;
      if(!novaUnidadeIdRetirada){ markInvalid("f_nova_unidade", "Selecione a unidade de destino."); invalid = true; }
    }
  }

  if(invalid){
    app.toast("⚠️ Preencha os campos obrigatórios marcados em vermelho!");
    return;
  }

  var targetId = isNovoSubmit ? localId("tanque") : novaForm.tankId;
  var isRetirada = novaForm.tipo === "Retirada";

  if(isNovoSubmit){
    var exists = (state.tanks||[]).some(function(t){
      return (t.serie || "").toString().trim().toUpperCase() === serie.toUpperCase();
    });
    if(exists){
      app.toast("⚠️ Um tanque com a Série "+serie+" já está cadastrado no sistema.");
      return;
    }

    var novoTank = {
      id: targetId,
      serie: serie,
      patrimonio: patrimonio,
      capacidade: capacidade||0,
      status: "estoque",
      marca: novaForm.marca || "",
      ano_fabricacao: novaForm.ano_fabricacao ? (parseInt(novaForm.ano_fabricacao, 10) || null) : null,
      produtor: novaForm.produtorNome ? {nome: novaForm.produtorNome, propriedade: novaForm.produtorProp||"", matricula: novaForm.produtorMatricula||""} : null,
      local: {latitude: novaForm.latitude||null, longitude: novaForm.longitude||null, municipio: novaForm.municipio||"Naque - MG"},
      foto: (novaForm.fotos && (novaForm.fotos.geral || novaForm.fotos.abrigo)) ? (novaForm.fotos.geral || novaForm.fotos.abrigo) : null,
      unidade_id: unidadeId,
      contrato_assinado: (novaForm.contratoAssinado === "sim"),
      historico: [{
        id: localId("hist"),
        data: novaForm.data,
        tipo: novaForm.tipo,
        produtor: novaForm.produtorNome || "—",
        litros: capacidade||0,
        desc: novaForm.desc || "(sem observações)",
        fotos: Object.keys(novaForm.fotos||{}).map(function(k){return novaForm.fotos[k];}).filter(Boolean)
      }]
    };
    state.tanks.unshift(novoTank);
  } else {
    var tExist = findTank(targetId);
    if(!tExist && state.tanks && state.tanks.length > 0){
      tExist = state.tanks[0];
    }
    if(!tExist){ app.toast("⚠️ Selecione um tanque válido para registrar a visita."); return; }

    if(!isRetirada && novaForm.produtorNome){
      tExist.produtor = {nome: novaForm.produtorNome, propriedade: novaForm.produtorProp, matricula: novaForm.produtorMatricula};
      if(novaForm.tipo === "Instalação"){
        tExist.contrato_assinado = (novaForm.contratoAssinado === "sim");
      }
    }
    if(!tExist.local) tExist.local = {};
    if(novaForm.municipio) tExist.local.municipio = novaForm.municipio;
    if(novaForm.latitude) tExist.local.latitude = novaForm.latitude;
    if(novaForm.longitude) tExist.local.longitude = novaForm.longitude;

    var descTxt = novaForm.desc || "";
    if(novaForm.tipo === "Manutenção"){ tExist.status = "manutencao"; }
    else if(isRetirada){
      tExist.produtor = null;
      var destinoNome = retiradaDestino === "manutencao" ? "manutenção" : (retiradaDestino === "outra_unidade" ? "outra unidade" : "estoque");
      tExist.status = retiradaDestino === "manutencao" ? "manutencao" : "estoque";
      var notaRet = "Retirada — destino: "+destinoNome+".";
      descTxt = descTxt ? (notaRet+" "+descTxt) : notaRet;
    }
    else if(tExist.status !== "em_operacao" && novaForm.tipo==="Instalação"){ tExist.status = "em_operacao"; }

    var fotosArr = Object.keys(novaForm.fotos||{}).map(function(k){return novaForm.fotos[k];}).filter(Boolean);
    if(novaForm.fotos && novaForm.fotos.geral) tExist.foto = novaForm.fotos.geral;
    else if(novaForm.fotos && novaForm.fotos.abrigo && !tExist.foto) tExist.foto = novaForm.fotos.abrigo;

    if(!Array.isArray(tExist.historico)) tExist.historico = [];
    tExist.historico.unshift({id: localId("hist"), data: novaForm.data, tipo: novaForm.tipo, produtor: isRetirada ? "—" : (novaForm.produtorNome||"—"), litros: capacidade||tExist.capacidade, desc: descTxt||"(sem observações)", fotos: fotosArr});

    if(isRetirada && retiradaDestino === "outra_unidade" && novaUnidadeIdRetirada){
      var origemNome = unidadeNome(tExist.unidade_id);
      var destinoUnidadeNome = unidadeNome(novaUnidadeIdRetirada);
      tExist.unidade_id = novaUnidadeIdRetirada;
      var notaTransf = "Transferido da unidade "+origemNome+" para "+destinoUnidadeNome+" (via retirada).";
      tExist.historico.unshift({id: localId("hist"), data: novaForm.data, tipo: "Transferência de unidade", produtor: "—", litros: tExist.capacidade, desc: notaTransf, fotos: []});
    }
  }

  unmarkTankDeleted(targetId);
  if(serie) unmarkTankDeleted(serie);
  if(patrimonio) unmarkTankDeleted(patrimonio);

  state.tanks = dedupeTanks(state.tanks);
  state.unidadeFilter = "";
  state.statusFilter = "";
  state.filter = "";
  saveCache();
  saveSharedTanks(state.tanks);

  try{
    var directUuid = tankToUUID(tExist);
    var sbRowUpdate = {
      id: directUuid,
      serie: String(tExist.serie || "").trim(),
      patrimonio: String(tExist.patrimonio || "").trim(),
      capacidade: parseInt(tExist.capacidade, 10) || 0,
      status: String(tExist.status || "estoque").trim(),
      produtor_nome: tExist.produtor ? (tExist.produtor.nome || null) : null,
      produtor_propriedade: tExist.produtor ? (tExist.produtor.propriedade || null) : null,
      unidade_id: (tExist.unidade_id && tExist.unidade_id.length === 36) ? tExist.unidade_id : "9adeb73d-b1f4-4d0c-87e5-a6138758900b"
    };

    await sb.from("tanques").update(sbRowUpdate).eq("id", directUuid);
    await sb.from("tanques").update(sbRowUpdate).eq("serie", String(tExist.serie || "").trim());

    var sbHistRow = {
      tanque_id: directUuid,
      data: novaForm.data || new Date().toISOString().split("T")[0],
      tipo: novaForm.tipo || "Visita",
      produtor: isRetirada ? "—" : (novaForm.produtorNome || "—"),
      litros: parseInt(capacidade || tExist.capacidade, 10) || 0,
      desc_texto: descTxt || "(sem observações)"
    };
    await sb.from("historico").insert([sbHistRow]);
  }catch(directErr){}

  await pushToCloudMaster();
  notifyOtherTabs();
  app.toast("✅ Registro salvo e sincronizado!");
  novaForm = novoFormVazio();
  novaTankBusca = "";
  app.openTank(targetId);
};

    municipio: t.local.municipio, latitude: t.local.latitude, longitude: t.local.longitude,

app.onEditTankPhoto = async function(input){
  var file = input.files && input.files[0];
  if(!file) return;
  try{
    var dataUrl = await resizeImageFile(file, 1280, 0.72);
    editTankForm.novaFoto = dataUrl;
    renderEditarTanque();
  }catch(e){
    app.toast("Não foi possível processar a foto.");
  }
};

app.salvarEdicaoTanque = async function(){
  if(!hasPerm("editar")){ app.toast("Seu usuário não tem permissão para editar."); return; }
  clearInvalid();
  var t = findTank(editTankForm.id);
  if(!t){ app.goto("painel"); return; }

  var rawSerie = (document.getElementById("e_serie").value||"").trim();
  var rawPatrimonio = (document.getElementById("e_patrimonio").value||"").trim();
  var serie = formatSerie(rawSerie);
  var patrimonio = formatPatrimonio(rawPatrimonio);
  var capacidade = parseInt(document.getElementById("e_capacidade").value, 10) || 0;
  var marca = (document.getElementById("e_marca").value || "").trim();
  var anoFab = parseInt(document.getElementById("e_ano_fabricacao").value, 10) || null;
  var status = document.getElementById("e_status").value;
  var prodMatricula = (document.getElementById("e_prodmatricula").value||"").trim();
  var prodNome = (document.getElementById("e_prodnome").value||"").trim();
  var prodProp = (document.getElementById("e_prodprop").value||"").trim();
  var contratoAssinado = document.getElementById("e_contrato_assinado").value === "sim";
  var municipio = (document.getElementById("e_municipio").value||"").trim();
  var latitude = document.getElementById("e_lat").value;
  var longitude = document.getElementById("e_lng").value;

  var invalid = false;
  if(!rawSerie){ markInvalid("e_serie", "Informe o número de série."); invalid = true; }
  if(!rawPatrimonio){ markInvalid("e_patrimonio", "Informe o número de patrimônio."); invalid = true; }
  if(!municipio){ markInvalid("e_municipio", "Informe o município."); invalid = true; }
  if(invalid) return;

  var unidadeId = document.getElementById("e_unidade") ? document.getElementById("e_unidade").value : t.unidade_id;

  t.serie = serie;
  t.patrimonio = patrimonio;
  t.capacidade = capacidade || 0;
  t.status = status;
  t.unidade_id = unidadeId;
  t.marca = marca;
  t.ano_fabricacao = anoFab;
  t.produtor = prodNome ? { nome: prodNome, propriedade: prodProp, matricula: prodMatricula } : null;
  if(!t.local) t.local = {};
  t.local.municipio = municipio;
  t.local.latitude = latitude || null;
  t.local.longitude = longitude || null;
  t.contrato_assinado = contratoAssinado;

  if(editTankForm.novaFoto){
    try{
      var pubUrl = await uploadFotoParaStorage(editTankForm.novaFoto, t.unidade_id, t.id, "capa");
      t.foto = pubUrl;
    }catch(fotoErr){
      t.foto = editTankForm.novaFoto;
    }
  }

  saveCache();
  saveSharedTanks(state.tanks);

  try{
    var sbPayload = {
      id: tankToUUID(t),
      serie: serie,
      patrimonio: patrimonio,
      capacidade: capacidade || 0,
      status: status,
      produtor_nome: prodNome || null,
      produtor_propriedade: prodProp || null,
      unidade_id: (unidadeId && unidadeId.length === 36) ? unidadeId : "9adeb73d-b1f4-4d0c-87e5-a6138758900b"
    };
    await sb.from("tanques").update(sbPayload).eq("id", sbPayload.id);
    await sb.from("tanques").update(sbPayload).eq("serie", serie);
    await sb.from("tanques").upsert([sbPayload], { onConflict: "id" });
  }catch(e){
    console.warn("Supabase update warning:", e);
  }

  await pushToCloudMaster();
  notifyOtherTabs();
  app.toast("✅ Tanque atualizado e sincronizado!");
  app.openTank(t.id);
};

app.excluirTanque = async function(id){
  if(!hasPerm("excluir")){ app.toast("Seu usuário não tem permissão para excluir."); return; }
  var t = findTank(id);
  if(!t) return;

  if(!confirm("Excluir o tanque Série "+t.serie+"? Todo o histórico será perdido. Essa ação não pode ser desfeita.")) return;

  markTankDeleted(t.id);
  markTankDeleted(tankToUUID(t));
  if(t.serie) markTankDeleted(t.serie);
  if(t.patrimonio) markTankDeleted(t.patrimonio);

  var targetUuid = tankToUUID(t);
  var targetSerieNorm = (t.serie || "").toString().trim().toUpperCase();

  state.tanks = (state.tanks || []).filter(function(x){
    var xUuid = tankToUUID(x);
    var xSerieNorm = (x.serie || "").toString().trim().toUpperCase();
    var isMatch = (x.id === id) || (x.id === t.id) || (xUuid === targetUuid) || (targetSerieNorm && xSerieNorm === targetSerieNorm);
    return !isMatch;
  });

  saveCache();
  saveSharedTanks(state.tanks);

  try{
    await sb.from("tanques").delete().eq("id", targetUuid);
    if(t.id && t.id !== targetUuid) await sb.from("tanques").delete().eq("id", t.id);
    if(t.serie) await sb.from("tanques").delete().eq("serie", t.serie);
  }catch(e){}

  await pushToCloudMaster();
  notifyOtherTabs();
  app.toast("Tanque "+t.serie+" excluído com sucesso.");
  app.goto("painel");
};

// ---------- EDITAR REGISTRO DO HISTORICO ----------
var editRegForm = null;

app.editarRegistro = function(tankId, hId){
  if(!hasPerm("editar")){ app.toast("Seu usuário não tem permissão para editar."); return; }
  var t = findTank(tankId);
  if(!t) return;
  var h = t.historico.filter(function(x){ return x.id === hId; })[0];
  if(!h) return;
  if(isLocalId(hId) || isLocalId(tankId)){
    app.toast("Este registro ainda não foi sincronizado. Aguarde a conexão para editá-lo.");
    return;
  }
  editRegForm = {tankId: tankId, hId: hId, tipo: h.tipo, data: h.data, produtor: h.produtor, desc: h.desc};
  app.goto("editarRegistro", tankId);
};

function renderEditarRegistro(){
  if(!editRegForm){ app.goto("painel"); return; }
  var t = findTank(editRegForm.tankId);
  if(!t){ app.goto("painel"); return; }

  document.getElementById("topTitle").textContent = "Editar registro";
  document.getElementById("topSub").textContent = "Série "+t.serie;

  var html = '';
  html += '<div class="field"><label>Tipo de registro</label><select id="r_tipo">'+
    ["Cadastro","Instalação","Visita de rotina","Manutenção","Retirada","Transferência de unidade"].map(function(o){
      return '<option '+(editRegForm.tipo===o?'selected':'')+'>'+o+'</option>';
    }).join('')+'</select></div>';
  html += '<div class="field"><label>Data</label><input id="r_data" type="date" value="'+editRegForm.data+'"/></div>';
  html += '<div class="field"><label>Produtor</label><input id="r_produtor" value="'+esc(editRegForm.produtor==="—"?"":editRegForm.produtor)+'"/></div>';
  html += '<div class="field"><label>Observações</label><textarea id="r_desc">'+esc(editRegForm.desc)+'</textarea></div>';

  html += '<div class="row-btns" style="margin-top:18px;">'+
    '<button class="btn" onclick="app.openTank(\''+t.id+'\')">Cancelar</button>'+
    '<button class="btn btn-primary" onclick="app.salvarEdicaoRegistro()">Salvar</button>'+
  '</div>';
  if(hasPerm("excluir")){
    html += '<button class="btn btn-danger no-print" style="margin-top:10px;" onclick="app.excluirRegistro(\''+t.id+'\',\''+editRegForm.hId+'\')">Excluir registro</button>';

  document.getElementById("screen").innerHTML = html;

app.salvarEdicaoRegistro = async function(){
  if(!hasPerm("editar")){ app.toast("Seu usuário não tem permissão para editar."); return; }
  if(!isOnline()){ app.toast("Editar um registro já sincronizado exige conexão com a internet."); return; }
  clearInvalid();
  var data = document.getElementById("r_data").value;
  if(!data){ markInvalid("r_data", "Informe a data."); return; }

  var upd = await sb.from("historico").update({
    tipo: document.getElementById("r_tipo").value,
    data: data,
    produtor: (document.getElementById("r_produtor").value||"").trim() || "—",
    desc_texto: (document.getElementById("r_desc").value||"").trim() || "(sem observações)"
  }).eq("id", editRegForm.hId);

  if(upd.error){ app.toast("Erro ao salvar: "+upd.error.message); return; }

  await loadTanques();
  saveCache();
  app.toast("Registro atualizado.");
  app.openTank(editRegForm.tankId);
};

app.excluirRegistro = async function(tankId, hId){
  if(!hasPerm("excluir")){ app.toast("Seu usuário não tem permissão para excluir."); return; }

  if(isLocalId(hId) || isLocalId(tankId)){
    app.toast("Este registro ainda não foi sincronizado. Aguarde a conexão para excluí-lo.");
    return;
  }

  if(!isOnline()){ app.toast("Excluir exige conexão com a internet."); return; }
  if(!confirm("Excluir este registro do histórico?")) return;
  var del = await sb.from("historico").delete().eq("id", hId);
  if(del.error){ app.toast("Erro ao excluir: "+del.error.message); return; }
  await loadTanques();
  saveCache();
  app.toast("Registro excluído.");
  app.openTank(tankId);
};

// ---------- RELATORIO ----------
var relSelected = null;
var relFilter = {tipo:"", de:"", ate:""};

app.exportarExcel = function(){
  if(!state.me || state.me.papel !== "admin"){
    app.toast("Apenas administradores podem exportar planilhas Excel.");
    return;
  }
  var selUnidadeEl = document.getElementById("rel_unidade_excel");
  var selUnidadeId = selUnidadeEl ? selUnidadeEl.value : "";

  var tanks = state.tanks;
  if(selUnidadeId){
    tanks = tanks.filter(function(t){ return t.unidade_id === selUnidadeId; });
  } else if(state.me && state.me.papel !== "admin" && state.me.unidade_id){
    tanks = tanks.filter(function(t){ return t.unidade_id === state.me.unidade_id; });
  }

  var headers = [
    "Unidade",
    "Número de Série",
    "Número de Patrimônio",
    "Capacidade (L)",
    "Status",
    "Matrícula Produtor",
    "Produtor Atual",
    "Propriedade",
    "Município",
    "Latitude (GPS)",
    "Longitude (GPS)",
    "Data de Instalação",
    "Instalado Por / Responsável",
    "Contrato Comodato",
    "Última Observação"
  ];

  var rows = [headers];

  tanks.forEach(function(t){
    var histInstalacao = (t.historico||[]).find(function(h){ return h.tipo === "Instalação"; });
    var dataInst = histInstalacao ? fmtDate(histInstalacao.data) : "—";
    var instalador = histInstalacao ? (histInstalacao.produtor || "Técnico") : "—";
    var temContrato = t.contrato_assinado ? "Assinado" : (t.produtor ? "Pendente" : "Sem contrato");
    var ultObs = (t.historico && t.historico[0]) ? t.historico[0].desc : "—";

    rows.push([
      unidadeNome(t.unidade_id),
      t.serie,
      t.patrimonio,
      t.capacidade || 0,
      STATUS_LABEL_MAP[t.status] || t.status,
      t.produtor ? (t.produtor.matricula || "—") : "—",
      t.produtor ? t.produtor.nome : "Sem produtor",
      t.produtor ? t.produtor.propriedade : "—",
      t.local ? t.local.municipio : "—",
      t.local ? t.local.latitude : "—",
      t.local ? t.local.longitude : "—",
      dataInst,
      instalador,
      temContrato,
      ultObs.replace(/(\r\n|\n|\r)/gm, " ")
    ]);
  });

  var csvContent = "\uFEFF" + rows.map(function(row){
    return row.map(function(cell){
      var str = (cell === null || cell === undefined) ? "" : String(cell);
      return '"' + str.replace(/"/g, '""') + '"';
    }).join(";");
  }).join("\r\n");

  var blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  var suffix = selUnidadeId ? ("_" + unidadeNome(selUnidadeId).replace(/[^a-zA-Z0-9]/g, "_")) : "_TodasUnidades";
  var fileName = "Relatorio_Tanques_Atalat" + suffix + "_" + todayISO() + ".csv";
  link.setAttribute("href", url);
  link.setAttribute("download", fileName);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  app.toast("Planilha Excel exportada com sucesso!");
};

    ["Cadastro","Instalação","Visita de rotina","Manutenção","Retirada","Transferência de unidade"].map(function(o){
      return '<option value="'+o+'" '+(relFilter.tipo===o?'selected':'')+'>'+o+'</option>';
    }).join('');

    '<div class="field" style="margin-bottom:8px;"><label>Filtrar histórico por tipo</label><select onchange="app.onRelFilter(\'tipo\', this.value)">'+tipoOpts+'</select></div>'+

      '<div class="field"><label>Até</label><input type="date" value="'+relFilter.ate+'" onchange="app.onRelFilter(\'ate\', this.value)"/></div>'+

app.definirSenhaUsuario = async function(){
  clearInvalid();
  var userId = document.getElementById("adm_user_select").value;
  var novaSenha = document.getElementById("adm_nova_senha").value;
  if(!userId){ markInvalid("adm_user_select", "Selecione o usuário."); return; }
  if(!novaSenha || novaSenha.length < 6){ markInvalid("adm_nova_senha", "A senha deve ter ao menos 6 caracteres."); return; }

  var u = findProfile(userId);
  if(!u){ app.toast("Usuário não encontrado."); return; }

  var email = (u.usuario || u.email || "").toLowerCase().trim();
  setDirectPassword(email, novaSenha);
  try{ await sb.auth.resetPasswordForEmail(email); }catch(e){}

  app.toast("✅ Senha de "+(u.nome||u.usuario)+" alterada com sucesso para '"+novaSenha+"'! Ele já pode entrar direto com a nova senha.");
  document.getElementById("adm_nova_senha").value = "";
};

app.alterarMinhaSenha = async function(){
  clearInvalid();
  var ns = document.getElementById("c_novasenha").value;
  var cs = document.getElementById("c_confsenha").value;
  if(!ns || ns.length < 6){ markInvalid("c_novasenha", "A nova senha deve ter ao menos 6 caracteres."); return; }
  if(ns !== cs){ markInvalid("c_confsenha", "As senhas não coincidem."); return; }

  app.toast("Alterando senha...");
  var res = await sb.auth.updateUser({ password: ns });
  if(res.error){
    app.toast("Erro ao alterar senha: " + res.error.message);
  } else {
    app.toast("Sua senha foi alterada com sucesso!");
    document.getElementById("c_novasenha").value = "";
    document.getElementById("c_confsenha").value = "";
  }
};

app.editarUsuario = function(id){

  var u = findProfile(id);
  if(!u) return;
  userForm = {id: u.id, nome: u.nome, papel: u.papel, unidadeId: u.unidade_id || ""};
  app.goto("usuarioForm");
};

app.enviarRedefinicaoSenha = async function(id){
  var u = findProfile(id);
  if(!u){ app.toast("Usuário não encontrado."); return; }
  var email = u.usuario || u.email;
  if(!email){ app.toast("E-mail do usuário não informado."); return; }
  app.toast("Enviando e-mail de redefinição...");
  var res = await sb.auth.resetPasswordForEmail(email);
  if(res.error){
    app.toast("Erro: " + res.error.message);
  } else {
    app.toast("E-mail de redefinição enviado para " + email);
  }
};

app.salvarUsuario = async function(){
  if(!hasPerm("gerenciarUsuarios")){ app.toast("Seu usuário não tem permissão para gerenciar usuários."); return; }
  clearInvalid();
  var nome = (document.getElementById("u_nome").value||"").trim();
  var papel = document.getElementById("u_papel").value;
  var unidadeId = document.getElementById("u_unidade").value || null;
  var novaSenha = document.getElementById("u_novasenha") ? document.getElementById("u_novasenha").value : "";
  var confNovaSenha = document.getElementById("u_confnovasenha") ? document.getElementById("u_confnovasenha").value : "";

  if(!nome){ markInvalid("u_nome", "Informe o nome."); return; }

  if(novaSenha || confNovaSenha){
    if(!novaSenha || novaSenha.length < 6){ markInvalid("u_novasenha", "A nova senha deve ter ao menos 6 caracteres."); return; }
    if(novaSenha !== confNovaSenha){ markInvalid("u_confnovasenha", "As senhas não coincidem."); return; }

    if(userForm.id === state.me.id){
      var resPass = await sb.auth.updateUser({ password: novaSenha });
      if(resPass.error){ app.toast("Erro ao alterar senha: " + resPass.error.message); return; }
    } else {
      var targetUser = findProfile(userForm.id);
      var targetEmail = (targetUser ? targetUser.usuario : "") || userForm.nome;
      await sb.auth.resetPasswordForEmail(targetEmail);
    }
  }

  if(userForm.id === state.me.id && papel !== "admin"){
    var outrosAdmins = state.profiles.filter(function(p){ return p.papel==="admin" && p.id!==userForm.id; });
    if(outrosAdmins.length === 0){
      app.toast("É preciso manter ao menos um administrador.");
      return;
    }
  }

  var targetUser = findProfile(userForm.id);
  
  if(targetUser){
    targetUser.nome = nome;
    targetUser.papel = papel;
    targetUser.unidade_id = unidadeId;
  }

  var keysToUpdate = [userForm.id, nome];
  if(targetUser){
    if(targetUser.usuario) keysToUpdate.push(targetUser.usuario);
    if(targetUser.email) keysToUpdate.push(targetUser.email);
  }

  for(var k = 0; k < keysToUpdate.length; k++){
    if(keysToUpdate[k]){
      setDirectProfile(keysToUpdate[k], { papel: papel, unidade_id: unidadeId, nome: nome });
    }
  }

  try{ saveDirectProfiles(state.profiles); }catch(e){}
  await pushToCloudMaster();

  try{
    var targetEmail = (targetUser ? (targetUser.usuario || targetUser.email) : "") || userForm.nome;

    if(userForm.id && userForm.id.length === 36){
      await sb.from("profiles").upsert({
        id: userForm.id,
        nome: nome,
        papel: papel,
        unidade_id: (unidadeId && unidadeId.length === 36) ? unidadeId : null,
        usuario: targetEmail
      });
    }

    if(targetEmail){
      await sb.from("profiles").update({
        nome: nome,
        papel: papel,
        unidade_id: (unidadeId && unidadeId.length === 36) ? unidadeId : null
      }).eq("usuario", targetEmail);

      await sb.from("profiles").update({
        nome: nome,
        papel: papel,
        unidade_id: (unidadeId && unidadeId.length === 36) ? unidadeId : null
      }).eq("email", targetEmail);
    }
  }catch(e){}

  await loadProfiles();
  
  if(state.me && (state.me.id === userForm.id || keysToUpdate.map(normalizeUserKey).includes(normalizeUserKey(state.me.usuario)))){
    state.me.papel = papel;
    state.me.unidade_id = unidadeId;
    state.me.nome = nome;
  }

  saveCache();
  app.toast("✅ Usuário "+nome+" salvo com sucesso como '"+ROLE_LABEL[papel]+"'!");
  syncNavbar();
  app.goto("config");
};

app.excluirUsuario = async function(id){
  if(!hasPerm("gerenciarUsuarios")){ app.toast("Seu usuário não tem permissão para gerenciar usuários."); return; }
  var target = findProfile(id);
  if(!target) return;

  var targetEmail = (target.usuario || target.email || "").toLowerCase().trim();
  
  if(targetEmail === "italo.pauloip01@gmail.com" || (state.me && targetEmail === (state.me.usuario||"").toLowerCase().trim())){
    app.toast("⚠️ A conta principal do proprietário (Italo Silva) não pode ser removida.");
    return;
  }

  if(!confirm("Remover permanentemente o acesso e a conta de "+(target.nome || target.usuario)+"?")) return;

  markProfileDeleted(target);

  state.profiles = state.profiles.filter(function(u){
    return !isProfileDeleted(u);
  });

  try{ saveDirectProfiles(state.profiles); }catch(e){}
  try{ localStorage.setItem("atalat_direct_profiles_v1", JSON.stringify(state.profiles)); }catch(e){}

  try{
    var passes = JSON.parse(localStorage.getItem(DIRECT_AUTH_KEY) || "{}");
    if(targetEmail && passes[targetEmail]) {
      delete passes[targetEmail];
      localStorage.setItem(DIRECT_AUTH_KEY, JSON.stringify(passes));
    }
  }catch(e){}

  try{ await sb.from("profiles").delete().eq("id", id); }catch(e){}

  await pushToCloudMaster();
  notifyOtherTabs();
  checkActiveUserRevocation();

  app.toast("✅ Usuário removido com sucesso!");
  render();
};

// ---------- ROUTER ----------
app.goto = function(view, param){
  if(view==="nova" && !hasPerm("criar")){
    app.toast("Seu usuário não tem permissão para criar registros.");
    view = "painel";
  }
  if(view==="config"){
    if(hasPerm("gerenciarUsuarios")) loadProfiles().then(render);
  }
  state.view = view;
  if(param!==undefined) state.selected = param;
  document.querySelectorAll("#navbar button").forEach(function(b){
    b.classList.toggle("active", b.dataset.view===view);
  });
  syncNavbar();
  render();
};

app.openTank = function(id){
  state.selected = id;
  state.view = "detalhe";
  document.querySelectorAll("#navbar button").forEach(function(b){b.classList.remove("active");});
  syncNavbar();
  render();
};

function render(){
  renderTopbarUser();
  syncNavbar();

  if(state.view==="carregando") renderCarregando();
  else if(state.view==="login") renderLogin();
  else if(state.view==="signup") renderSignup();
  else if(state.view==="forgot") renderForgotPassword();
  else if(!state.me){ renderCarregando(); }
  else if(state.view==="painel") renderPainel();
  else if(state.view==="nova") renderNova();
  else if(state.view==="relatorio") renderRelatorio();
  else if(state.view==="detalhe") renderDetalhe();
  else if(state.view==="transferir") renderTransferir();
  else if(state.view==="editarTanque") renderEditarTanque();
  else if(state.view==="editarRegistro") renderEditarRegistro();
  else if(state.view==="config") renderConfig();
  else if(state.view==="usuarioForm") renderUsuarioForm();

  if(!document.getElementById("toastEl")){
    var t = document.createElement("div");
    t.className="toast";
    t.id="toastEl";
    document.querySelector(".phone").appendChild(t);
  }
}

init();

  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function(err) {});
  });
}
